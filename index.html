<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter App</title>
</head>
<body>
    <form id="tweetForm">
        <label for="tweetText">Tweet Text:</label>
        <input type="text" id="tweetText" name="tweetText" required>
        
        <label for="tweetImage">Upload Image:</label>
        <input type="file" id="tweetImage" name="tweetImage" accept="image/*">
        
        <button type="submit">Post Tweet</button>
    </form>
    
    <script>
        document.getElementById('tweetForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = new FormData(event.target);
            const response = await fetch('/tweet', {
                method: 'POST',
                body: JSON.stringify({
                    text: form.get('tweetText'),
                    media: form.get('tweetImage') ? await toBase64(form.get('tweetImage')) : null,
                    auth_token: 'your_auth_token_here'
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const result = await response.json();
            alert('Tweet Status: ' + result.success);
        });

        async function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
